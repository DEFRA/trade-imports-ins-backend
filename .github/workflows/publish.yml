name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: $${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: 25
          cache: 'maven'

      - name: Run tests
        run: mvn clean verify

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Adds linux/arm64 to the Docker Hub tags the build job has just published.
  # Runs after it, never gates it, and never touches ECR.
  publish-arm64:
    needs: build
    uses: DEFRA/trade-imports-workspace/.github/workflows/publish-multiarch.yml@main
    with:
      image-name: trade-imports-ins-backend

  ## SonarCloud
  ## Uncomment to unable SonarCloud scan
  ## Requires project to be set up in SonarCloud
  ## and the SonarCloud token to be set in the repository secrets
