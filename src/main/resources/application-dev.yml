# CDP dev environment. Active because spring.profiles.active is derived from ENVIRONMENT.

# EUDPA-390 address lookup spike. The real dev values come from cdp-app-config once raised, so
# every setting here falls back to a deliberately fake value that resolves to nothing — never the
# real, rate-limited lookup.
address-lookup:
  api-url: ${ADDRESS_LOOKUP_API_URL:http://host.docker.internal:8087/simulator/address-lookup/v2.1/addresses}
  tenant-id: ${ADDRESS_LOOKUP_TENANT_ID:11111111-1111-1111-1111-111111111111}
  oauth-token-url: ${ADDRESS_LOOKUP_OAUTH_TOKEN_URL:http://host.docker.internal:8087/simulator/entra/${address-lookup.tenant-id}/oauth2/v2.0/token}
  client-id: ${ADDRESS_LOOKUP_CLIENT_ID:22222222-2222-2222-2222-222222222222}
  client-scope: ${ADDRESS_LOOKUP_CLIENT_SCOPE:33333333-3333-3333-3333-333333333333/.default}
  audience: ${ADDRESS_LOOKUP_AUDIENCE:api://AzureADTokenExchange}
  signing-algorithm: ${ADDRESS_LOOKUP_SIGNING_ALGORITHM:RS256}
  assertion-duration-seconds: ${ADDRESS_LOOKUP_ASSERTION_DURATION_SECONDS:900}
  max-results: ${ADDRESS_LOOKUP_MAX_RESULTS:100}
  default-postcode: ${ADDRESS_LOOKUP_DEFAULT_POSTCODE:SW1A 1AA}
  # Blank by default — real dev must reach real AWS STS. Only the workspace stack's compose file
  # sets APP_AWS_STS_ENDPOINT_OVERRIDE, pointing this at the trade-imports-stub simulator.
  sts-endpoint-override: ${APP_AWS_STS_ENDPOINT_OVERRIDE:}

# The ClientRegistration Spring Security's OAuth2 client uses. The registration key and the
# provider key must match each other and FederatedTokenConfig.CLIENT_REGISTRATION_ID — a mismatch
# silently yields no registration. The client authenticates with a client_assertion added by
# FederatedTokenConfig's token-response parameters converter rather than a secret, hence
# client-authentication-method: none.
spring:
  security:
    oauth2:
      client:
        registration:
          address-lookup:
            client-id: ${address-lookup.client-id}
            client-authentication-method: none
            authorization-grant-type: client_credentials
            scope: ${address-lookup.client-scope}
        provider:
          address-lookup:
            token-uri: ${address-lookup.oauth-token-url}
