# Development profile - exposes additional actuator endpoints for debugging
# MongoDB URI should be set via MONGO_URI environment variable
# (defaults are in application.yml)

logging:
  level:
    root: DEBUG
    uk.gov.defra.trade.imports.ins.backend: DEBUG
    org.mongodb.driver: ${LOGGING_LEVEL_ORG_MONGODB_DRIVER:WARN}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: when-authorized
spring:
  data:
    mongodb:
      ssl:
        enabled: false
  # The ClientRegistration Spring Security's OAuth2 client uses. The registration key and the
  # provider key must match each other and FederatedTokenConfig.CLIENT_REGISTRATION_ID — a mismatch
  # silently yields no registration. The client authenticates with a client_assertion added by
  # FederatedTokenConfig's token-response parameters converter rather than a secret, hence
  # client-authentication-method: none.
  security:
    oauth2:
      client:
        registration:
          address-lookup:
            client-id: ${address-lookup.client-id}
            client-authentication-method: none
            authorization-grant-type: client_credentials
            scope: ${address-lookup.client-scope}
        provider:
          address-lookup:
            token-uri: ${address-lookup.oauth-token-url}

# App-level overrides for local development
# AWS credentials are dummy values accepted by Floci — never use real keys here
app:
  aws:
    endpoint-override: ${APP_AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
    access-key-id: test
    secret-access-key: test

aws:
  sqs:
    notification:
      queue-url: ${NOTIFICATION_SQS_QUEUE_URL:http://localhost:4566/000000000000/trade_imports_animals_eu_notifications_ins_backend.fifo}

# EUDPA-390 address lookup spike, pointed at the trade-imports-stub simulators. Running outside
# the stack (mvn spring-boot:run), the stub's port is reached via localhost; the stack overrides
# each URL with a host.docker.internal one through the environment variables below.
address-lookup:
  api-url: ${ADDRESS_LOOKUP_API_URL:http://localhost:8087/simulator/address-lookup/v2.1/addresses}
  tenant-id: ${ADDRESS_LOOKUP_TENANT_ID:11111111-1111-1111-1111-111111111111}
  oauth-token-url: ${ADDRESS_LOOKUP_OAUTH_TOKEN_URL:http://localhost:8087/simulator/entra/${address-lookup.tenant-id}/oauth2/v2.0/token}
  client-id: ${ADDRESS_LOOKUP_CLIENT_ID:22222222-2222-2222-2222-222222222222}
  client-scope: ${ADDRESS_LOOKUP_CLIENT_SCOPE:api://33333333-3333-3333-3333-333333333333/.default}
  audience: ${ADDRESS_LOOKUP_AUDIENCE:api://AzureADTokenExchange}
  signing-algorithm: ${ADDRESS_LOOKUP_SIGNING_ALGORITHM:RS256}
  assertion-duration-seconds: ${ADDRESS_LOOKUP_ASSERTION_DURATION_SECONDS:900}
  max-results: ${ADDRESS_LOOKUP_MAX_RESULTS:100}
  default-postcode: ${ADDRESS_LOOKUP_DEFAULT_POSTCODE:SW1A 1AA}
  # Its own port, root path: the SDK always POSTs GetWebIdentityToken to "/" of the endpoint
  # override, discarding any path, so the STS simulator cannot share 8087 with the others.
  sts-endpoint-override: ${APP_AWS_STS_ENDPOINT_OVERRIDE:http://localhost:8098}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
