server:
  port: ${PORT:8090}
  shutdown: graceful

spring:
  application:
    name: trade-imports-ins-backend
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/}
      database: ${MONGO_DATABASE:trade-imports-ins-backend}
      auto-index-creation: true
      read-preference: ${MONGO_READ_PREFERENCE:secondary}
      write-concern: ${MONGO_WRITE_CONCERN:majority}
      connection-pool:
        min-size: ${MONGO_POOL_MIN_SIZE:10}
        max-size: ${MONGO_POOL_MAX_SIZE:100}
        max-wait-time-ms: ${MONGO_POOL_MAX_WAIT_TIME_MS:2000}
        max-connection-idle-time-ms: ${MONGO_POOL_MAX_IDLE_TIME_MS:60000}
      ssl:
        enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    aws:
      region:
        static: ${aws.region}


# CDP platform configuration
cdp:
  certificate: ${TRUSTSTORE_CDP_ROOT_CA:}
  metrics:
    enabled: true
  service-version: ${SERVICE_VERSION:0.0.0-local}
  tracing:
    header-name: ${TRACING_HEADER:x-cdp-request-id}
  cloudwatch:
    endpoint: ${AWS_EMF_AGENT_ENDPOINT:http://localhost:4566}
  proxyUrl: ${HTTP_PROXY:}

# AWS configuration
aws:
  region: ${AWS_REGION:eu-west-2}
  sqs:
    notification:
      queue-url: ${NOTIFICATION_SQS_QUEUE_URL:}
      wait-time-seconds: ${SQS_WAIT_TIME_SECONDS:10}
      max-messages: ${SQS_MAX_MESSAGES:10}
  emf:
    enabled: ${AWS_EMF_ENABLED:true}
    environment: ${AWS_EMF_ENVIRONMENT:Local}
    namespace: ${AWS_EMF_NAMESPACE:trade-imports-ins-backend}
    service:
      name: ${AWS_EMF_SERVICE_NAME:trade-imports-ins-backend}
      type: ${AWS_EMF_SERVICE_TYPE:SpringBootApp}

app:
  aws:
    endpoint-override: ${APP_AWS_ENDPOINT_OVERRIDE:}
    # Local development only — set via environment variables or application-local.yml.
    # Do NOT set real credentials here; these keys are ignored in deployed environments.
    # access-key-id: ${APP_AWS_ACCESS_KEY_ID:}
    # secret-access-key: ${APP_AWS_SECRET_ACCESS_KEY:}

# Logging configuration
logging:
  level:
    root: ${LOG_LEVEL:info}
    uk.gov.defra.trade.imports.ins.backend: ${LOG_LEVEL:DEBUG}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
    org.mongodb: ${LOGGING_LEVEL_ORG_MONGODB_DRIVER:WARN}
    io.netty.handler.logging.LoggingHandler: WARN
    sun.rmi: WARN
    javax.management.remote.rmi: WARN

# Actuator endpoints
# Production: Only health endpoint exposed (secure by default)
# Development: Use dev profile (application-local.yml) for debugging endpoints
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,metrics,info,cache
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
  health:
    mongo:
      enabled: false
  metrics:
    enabled: ${METRICS_ENABLED:true}
    enable:
      all: false
      controller: true
      jvm:
        memory:
          committed: true
          used: true
          max: true
        threads:
          live: true
          peak: true
      http:
        server:
          requests:
            active: true

# Application info (exposed via /info endpoint)
info:
  app:
    name: ${spring.application.name}
    version: ${cdp.service-version}
    environment: ${ENVIRONMENT:local}
